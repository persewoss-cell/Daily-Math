<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>매일 수학</title>
<meta name="description" content="매일 같은 날엔 같은 곱셈·나눗셈 문제 3개, 두 자리 수 곱셈과 3학년 2학기 나눗셈을 연습하고 문제지와 정답 이미지를 저장할 수 있는 연산 연습 사이트" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Courier+Prime:wght@400;700&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #f3f5fb;
    --paper-line: #ccd6f0;
    --ink: #1d2440;
    --ink-soft: #55608a;
    --surface: #ffffff;
    --surface-border: #d7def2;
    --accent: #4c5fd5;
    --accent-ink: #3a49b0;
    --accent-soft: #e4e7fb;
    --red-pen: #d6483c;
    --red-pen-ink: #b8382e;
    --red-soft: #fbe1de;
    --green: #2e9e6c;
    --green-soft: #def3e8;
    --amber: #b8791f;
    --amber-soft: #f7e9d2;
    --shadow: 0 1px 2px rgba(29,36,64,0.06), 0 10px 26px -14px rgba(29,36,64,0.22);
    --font-display: 'Gaegu', 'Nanum Pen Script', 'Comic Sans MS', sans-serif;
    --font-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --font-mono: 'Courier Prime', 'Courier New', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #10142a;
      --paper-line: #232b52;
      --ink: #e8eaf7;
      --ink-soft: #a9b0d6;
      --surface: #171c38;
      --surface-border: #2b3363;
      --accent: #8892f0;
      --accent-ink: #a6aef5;
      --accent-soft: #262c58;
      --red-pen: #ff8477;
      --red-pen-ink: #ff9d92;
      --red-soft: #3c1f1d;
      --green: #5fd0a0;
      --green-soft: #1c3a2e;
      --amber: #e9ae55;
      --amber-soft: #3b2e17;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 14px 30px -16px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #10142a;
    --paper-line: #232b52;
    --ink: #e8eaf7;
    --ink-soft: #a9b0d6;
    --surface: #171c38;
    --surface-border: #2b3363;
    --accent: #8892f0;
    --accent-ink: #a6aef5;
    --accent-soft: #262c58;
    --red-pen: #ff8477;
    --red-pen-ink: #ff9d92;
    --red-soft: #3c1f1d;
    --green: #5fd0a0;
    --green-soft: #1c3a2e;
    --amber: #e9ae55;
    --amber-soft: #3b2e17;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 14px 30px -16px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 30px 30px;
    background-position: -1px -1px;
    color: var(--ink);
    font-family: var(--font-body);
    font-variant-numeric: tabular-nums;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  h1, h2, h3 { text-wrap: balance; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .page { max-width: 1080px; margin: 0 auto; }

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 20px;
    padding-bottom: 18px;
    margin-bottom: 22px;
    border-bottom: 2px dashed var(--paper-line);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .brand svg { width: 40px; height: 40px; flex-shrink: 0; color: var(--accent); }
  .brand h1 {
    font-family: var(--font-display);
    font-size: clamp(1.7rem, 3.4vw, 2.3rem);
    margin: 0;
    line-height: 1;
  }
  .brand .tagline {
    margin: 4px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .today {
    text-align: right;
    line-height: 1.3;
  }
  .today-label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }
  .today-date {
    display: block;
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 0.95rem;
  }

  .mode-tabs {
    display: inline-flex;
    gap: 3px;
    padding: 3px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 10px;
  }
  .mode-tab {
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--ink-soft);
    padding: 7px 16px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .mode-tab:hover { color: var(--accent-ink); }
  .mode-tab[aria-pressed="true"] { background: var(--accent); color: #fff; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 8px;
    border: 1px solid transparent;
    padding: 9px 14px;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.12s ease, background-color 0.12s ease, border-color 0.12s ease;
    white-space: nowrap;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn:active { transform: translateY(1px); }
  .btn-ghost {
    background: var(--surface);
    border-color: var(--surface-border);
    color: var(--ink);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent-ink); }
  .btn-shuffle {
    background: var(--accent-soft);
    color: var(--accent-ink);
  }
  .btn-shuffle:hover { background: var(--accent); color: #fff; }
  .btn-check {
    background: var(--red-soft);
    color: var(--red-pen-ink);
  }
  .btn-check:hover { background: var(--red-pen); color: #fff; }

  .board {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
  }
  .board[data-mode="div"] { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 14px;
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .problem-no {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }
  .diff-group {
    display: inline-flex;
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    overflow: hidden;
  }
  .diff-group[data-mode="div"] { border: none; }
  .diff-btn {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    padding: 6px 12px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    border-right: 1px solid var(--surface-border);
  }
  .diff-btn:last-child { border-right: none; }
  .diff-btn:hover { background: var(--paper); }
  .diff-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .unit-tag {
    padding: 5px 10px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent-ink);
    font-size: 0.85rem;
    font-weight: 700;
  }
  .diff-btn[aria-pressed="true"][data-diff="하"] { background: var(--green); color: #fff; }
  .diff-btn[aria-pressed="true"][data-diff="중"] { background: var(--amber); color: #fff; }
  .diff-btn[aria-pressed="true"][data-diff="상"] { background: var(--red-pen); color: #fff; }

  .problem {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: clamp(2.3rem, 8vw, 3.1rem);
    line-height: 1.15;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
  }
  .problem .top-num { padding-right: 2px; }
  .problem .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5em;
    width: 100%;
  }
  .problem .op { color: var(--accent); }
  .problem .rule {
    width: 100%;
    border-top: 3px solid var(--ink);
    margin-top: 2px;
  }
  .ld {
    display: grid;
    width: fit-content;
    font-family: var(--font-mono);
    font-weight: 700;
    line-height: 1.2;
  }
  .ld-cell { text-align: center; }
  .ld-divisor { grid-row: 2; grid-column: 1; text-align: right; padding-right: 0.08em; }
  .ld-bracket {
    grid-row: 2;
    grid-column: 2 / -1;
    border-left: 0.08em solid currentColor;
    border-top: 0.08em solid currentColor;
    border-top-left-radius: 0.45em 0.6em;
  }
  .ld-q { color: var(--red-pen-ink); }
  .ld-rule { border-top: 2px solid currentColor; margin: 0.12em 0; }
  .ld-result {
    margin-top: 10px;
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--red-pen-ink);
  }
  .problem .workspace {
    width: 100%;
    height: 84px;
    margin-top: 14px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 25px,
      var(--paper-line) 26px
    );
  }

  .card-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .card-actions .btn { flex: 1 1 auto; justify-content: center; }
  .card-actions .btn-undo {
    flex: 0 0 auto;
    width: 38px;
    padding: 9px;
    background: var(--surface);
    border-color: var(--surface-border);
    color: var(--ink-soft);
  }
  .card-actions .btn-undo:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

  .footer-bar {
    margin-top: 26px;
    padding-top: 16px;
    border-top: 2px dashed var(--paper-line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .credit {
    margin: 0;
    font-size: 0.82rem;
    color: var(--ink-soft);
  }
  .footer-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 13, 30, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal-card {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 30px 26px 26px;
    text-align: center;
  }
  .modal-close {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .modal-close:hover { background: var(--paper); color: var(--ink); }
  .modal-close svg { width: 18px; height: 18px; }
  .modal-eyebrow {
    margin: 0 0 12px;
    font-size: 0.82rem;
    color: var(--ink-soft);
  }
  .modal-calc {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: clamp(1.3rem, 6vw, 1.7rem);
    line-height: 1.3;
    width: fit-content;
    margin: 0 auto;
  }
  .modal-calc > div { width: 100%; text-align: right; }
  .modal-calc > .ld { width: fit-content; margin: 0 auto; }
  .modal-calc > .ld-result { text-align: center; }
  .modal-rule { border-top: 2px solid var(--ink); margin: 4px 0; }
  .modal-sum {
    font-size: clamp(1.7rem, 7vw, 2.15rem);
    color: var(--red-pen-ink);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 12px);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .btn, .toast { transition: none; }
  }

  .print-sheet { display: none; }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    .page, .modal-overlay, .toast { display: none !important; }
    html, body { height: auto; }
    body { background: #fff; padding: 0; }
    .print-sheet {
      display: block;
      background: #fff;
      color: #111;
      font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    .print-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10mm;
      padding-bottom: 4mm;
      border-bottom: 1px solid #999;
    }
    .print-title { font-size: 15pt; font-weight: 700; }
    .print-name-row { display: flex; align-items: baseline; gap: 3mm; }
    .print-name-label { font-size: 12pt; font-weight: 600; }
    .print-name-line { width: 55mm; border-bottom: 1px solid #111; height: 6mm; }
    .print-problems {
      display: flex;
      justify-content: space-between;
      gap: 10mm;
      margin-top: 6mm;
    }
    .print-problem {
      flex: 1;
      min-height: 100mm;
      border: 1px solid #ccc;
      border-radius: 3mm;
      padding: 5mm;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .print-problem .pp-label {
      align-self: flex-start;
      font-size: 9pt;
      color: #666;
      margin-bottom: 4mm;
    }
    .print-problem .pp-nums {
      font-family: 'Courier Prime', 'Courier New', Consolas, monospace;
      font-weight: 700;
      font-size: 26pt;
      line-height: 1.2;
      width: 100%;
      text-align: right;
    }
    .print-problem .pp-rule {
      width: 100%;
      border-top: 2px solid #111;
      margin-top: 2mm;
    }
    .print-problem .ld { margin-left: auto; }
    .print-sheet .ld-q, .print-sheet .ld-result { color: inherit; }
    .print-sheet[data-mode="div"] .print-problem { min-height: 78mm; }
    .print-answer .ld { font-size: 12pt; margin: 0 auto; }
    .print-answer .ld-result { margin-top: 2mm; font-size: 12pt; text-align: center; }
    .print-divider {
      border-top: 2px dashed #333;
      margin: 8mm 0 6mm;
    }
    .print-answers {
      display: flex;
      justify-content: space-between;
      gap: 10mm;
    }
    .print-answer {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .print-answer .pa-label {
      align-self: flex-start;
      font-size: 9pt;
      color: #666;
      margin-bottom: 2mm;
    }
    .print-answer .pa-calc {
      font-family: 'Courier Prime', 'Courier New', Consolas, monospace;
      font-weight: 700;
      font-size: 14pt;
      line-height: 1.2;
      width: fit-content;
    }
    .print-answer .pa-calc > div { width: 100%; text-align: right; }
    .print-answer .pa-rule { border-top: 1.5px solid #111; margin: 1mm 0; }
    .print-answer .pa-sum { font-size: 16pt; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="7" width="38" height="34" rx="4"></rect>
        <line x1="5" y1="18" x2="43" y2="18"></line>
        <line x1="16" y1="7" x2="16" y2="41"></line>
        <line x1="29.5" y1="7" x2="29.5" y2="41"></line>
        <line x1="11" y1="27" x2="21" y2="27"></line>
        <line x1="24" y1="27" x2="34" y2="27"></line>
      </svg>
      <div>
        <h1>매일 수학</h1>
        <p class="tagline" id="tagline">두 자리 수 &times; 두 자리 수 곱셈 연습</p>
      </div>
    </div>
    <div class="mode-tabs" id="mode-tabs" role="group" aria-label="연산 종류 선택">
      <button type="button" class="mode-tab" data-mode="mul">곱셈</button>
      <button type="button" class="mode-tab" data-mode="div">나눗셈</button>
    </div>
    <div class="today">
      <span class="today-label">오늘의 문제</span>
      <span class="today-date" id="today-date"></span>
    </div>
    <button class="btn btn-ghost" id="refresh-all" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="16 3 21 3 21 8"></polyline>
        <line x1="21" y1="3" x2="10" y2="14"></line>
        <path d="M21 13v3a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V8a5 5 0 0 1 5-5h3"></path>
      </svg>
      전체 새 문제
    </button>
  </header>

  <main class="board" id="board">
    <article class="card" data-index="0">
      <div class="card-top">
        <span class="problem-no">문제 1</span>
        <div class="diff-group" role="group" aria-label="문제 1 난이도 선택"></div>
      </div>
      <div class="problem"></div>
      <div class="card-actions">
        <button type="button" class="btn btn-shuffle" data-action="shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
          다른 문제
        </button>
        <button type="button" class="btn btn-undo" data-action="undo" title="되돌리기" aria-label="이전 문제로 되돌리기" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><polyline points="3 4 3 9 8 9"></polyline></svg>
        </button>
        <button type="button" class="btn btn-check" data-action="check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15.5V19a1 1 0 0 0 1 1h3.5L19 9.5a2.12 2.12 0 0 0-3-3L5.5 17"></path><line x1="14" y1="7" x2="17" y2="10"></line></svg>
          정답 확인
        </button>
      </div>
    </article>

    <article class="card" data-index="1">
      <div class="card-top">
        <span class="problem-no">문제 2</span>
        <div class="diff-group" role="group" aria-label="문제 2 난이도 선택"></div>
      </div>
      <div class="problem"></div>
      <div class="card-actions">
        <button type="button" class="btn btn-shuffle" data-action="shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
          다른 문제
        </button>
        <button type="button" class="btn btn-undo" data-action="undo" title="되돌리기" aria-label="이전 문제로 되돌리기" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><polyline points="3 4 3 9 8 9"></polyline></svg>

<script>
(function () {
  "use strict";

  var DIFF_DIGITS = {
    "하": { tens: [1, 2], units: [0, 9] },
    "중": { tens: [3, 5], units: [3, 9] },
    "상": { tens: [6, 9], units: [3, 9] }
  };

  var DIV_UNITS = [
    { key: "몇십", label: "몇십", name: "(몇십)÷(몇)" },
    { key: "몇십몇", label: "몇십몇", name: "(몇십몇)÷(몇)" },
    { key: "나머지", label: "나머지", name: "나머지가 있는 나눗셈" },
    { key: "세자리", label: "세 자리", name: "(세 자리 수)÷(한 자리 수)" }
  ];

  function mulberry32(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashString(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return (h ^ (h >>> 16)) >>> 0;
  }

  function randInt(rng, min, max) {
    return Math.floor(rng() * (max - min + 1)) + min;
  }

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function randDigitNumber(rng, digits) {
    var tens = randInt(rng, digits.tens[0], digits.tens[1]);
    var units = randInt(rng, digits.units[0], digits.units[1]);
    return tens * 10 + units;
  }

  function makeMulProblem(diff, rng) {
    var digits = DIFF_DIGITS[diff];
    var a = randDigitNumber(rng, digits);
    var b = randDigitNumber(rng, digits);
    return { kind: "mul", a: a, b: b, diff: diff, answer: a * b };
  }

  // 단원별로 가능한 [나뉠 수, 나누는 수] 조합을 모두 만들어 두고 그중에서 고른다.
  // 몇십 · 몇십몇 · 세 자리는 자리마다 나누어떨어지는(내림 없는) 수만, 나머지는 몫이 한 자리인 수만 쓴다.
  // 몇십몇 · 세 자리에서 5 이상으로 나누면 55÷5=11처럼 몫이 1로만 이루어져 너무 쉬우므로 2~4로만 나눈다.
  function buildDivPools() {
    var pools = { "몇십": [], "몇십몇": [], "나머지": [], "세자리": [] };
    for (var d = 2; d <= 9; d++) {
      var multiples = [];
      for (var m = d; m <= 9; m += d) multiples.push(m);
      multiples.forEach(function (t) {
        pools["몇십"].push([t * 10, d]);
        if (d > 4) return;
        multiples.forEach(function (u) {
          pools["몇십몇"].push([t * 10 + u, d]);
          multiples.forEach(function (v) {
            pools["세자리"].push([t * 100 + u * 10 + v, d]);
          });
        });
      });
      for (var a = 10; a < d * 10; a++) {
        if (a % d !== 0) pools["나머지"].push([a, d]);
      }
    }
    return pools;
  }
  var DIV_POOLS = buildDivPools();

  function makeDivProblem(unit, rng) {
    var pool = DIV_POOLS[unit];
    var pick = pool[Math.floor(rng() * pool.length)];
    var a = pick[0], b = pick[1];
    return { kind: "div", a: a, b: b, diff: unit, answer: Math.floor(a / b), remainder: a % b };
  }

  var dateStr = todayKey();

  var MODES = {
    mul: {
      name: "곱셈",
      tagline: "두 자리 수 × 두 자리 수 곱셈 연습",
      groupLabel: "난이도 선택",
      levels: [{ key: "하", label: "하" }, { key: "중", label: "중" }, { key: "상", label: "상" }],
      defaults: ["하", "중", "상"],
      seed: dateStr,
      make: makeMulProblem
    },
    div: {
      name: "나눗셈",
      tagline: "3학년 2학기 나눗셈 연습",
      groupLabel: "단원 선택",
      levels: DIV_UNITS,
      fixedLevels: true,
      defaults: DIV_UNITS.map(function (u) { return u.key; }),
      seed: dateStr + "#div",
      make: makeDivProblem
    }
  };

  function levelName(p) {
    if (p.kind === "mul") return "난이도 " + p.diff;
    return DIV_UNITS.filter(function (u) { return u.key === p.diff; })[0].name;
  }

  function resultText(p) {
    if (p.kind === "mul") return p.a + " × " + p.b + " = " + p.answer;
    return p.a + " ÷ " + p.b + " = " + p.answer + (p.remainder ? " … " + p.remainder : "");
  }

  function spokenText(p) {
    if (p.kind === "mul") return p.a + " 곱하기 " + p.b;
    return p.a + " 나누기 " + p.b;
  }

  var states = {};
  Object.keys(MODES).forEach(function (m) {
    var cfg = MODES[m];
    var rng = mulberry32(hashString(cfg.seed));
    var list = cfg.defaults.map(function (diff) { return cfg.make(diff, rng); });
    states[m] = { problems: list, history: list.map(function () { return []; }) };
  });

  var MODE_KEY = "daily-math-mode";
  function loadMode() {
    try {
      var saved = localStorage.getItem(MODE_KEY);
      if (saved && MODES[saved]) return saved;
    } catch (err) {}
    return "mul";
  }
  function saveMode(m) {
    try { localStorage.setItem(MODE_KEY, m); } catch (err) {}
  }

  var mode, problems, history;
  function useMode(m) {
    mode = m;
    problems = states[m].problems;
    history = states[m].history;
  }
  useMode(loadMode());

  function replaceProblem(index, diff, rng) {
    history[index].push(problems[index]);
    problems[index] = MODES[mode].make(diff, rng);
  }

  // 세로식 나눗셈 풀이 배치. 열은 나뉠 수의 자리(0 = 맨 앞)이고,
  // rows는 나뉠 수 아래에 차례로 쓰는 줄(수 또는 가로선)이다.
  function longDivisionLayout(a, d) {
    var digits = String(a).split("").map(Number);
    var n = digits.length;
    var quotient = digits.map(function () { return ""; });
    var rows = [];

    function numRow(value, endCol) {
      var s = String(value);
      var cells = [];
      for (var k = 0; k < s.length; k++) cells.push({ col: endCol - s.length + 1 + k, ch: s[k] });
      rows.push({ type: "num", cells: cells });
    }

    var r = 0, started = false;
    for (var i = 0; i < n; i++) {
      var cur = r * 10 + digits[i];
      if (!started && cur < d && i < n - 1) { r = cur; continue; }
      var startCol = i - String(cur).length + 1;
      if (started) numRow(cur, i);
      started = true;

      var q = Math.floor(cur / d);
      var prod = q * d;
      quotient[i] = String(q);
      r = cur - prod;

      // 60÷3처럼 남은 자리가 모두 0이면 교과서처럼 60을 한 줄에 쓰고 끝낸다.
      var restZero = digits.slice(i + 1).every(function (x) { return x === 0; });
      if (r === 0 && restZero && i < n - 1) {
        for (var k = i + 1; k < n; k++) quotient[k] = "0";
        numRow(prod * Math.pow(10, n - 1 - i), n - 1);
        rows.push({ type: "rule", from: startCol, to: n - 1 });
        numRow(0, n - 1);
        break;
      }

      numRow(prod, i);
      rows.push({ type: "rule", from: startCol, to: n - 1 });
      if (i === n - 1) numRow(r, n - 1);
    }
    return { n: n, digits: digits, quotient: quotient, rows: rows };
  }

  function buildLongDivision(p, showAnswer) {
    var L = longDivisionLayout(p.a, p.b);
    var el = document.createElement("div");
    el.className = "ld";
    el.style.gridTemplateColumns = "auto 0.32em repeat(" + L.n + ", 0.72em)";

    function cell(row, col, text, cls) {
      var c = document.createElement("span");
      c.className = "ld-cell" + (cls ? " " + cls : "");
      c.style.gridRow = row;
      c.style.gridColumn = col + 3;
      c.textContent = text || " ";
      el.appendChild(c);
    }

    for (var col = 0; col < L.n; col++) cell(1, col, showAnswer ? L.quotient[col] : "", "ld-q");

    var divisor = document.createElement("span");
    divisor.className = "ld-divisor";
    divisor.textContent = p.b;
    el.appendChild(divisor);
    var bracket = document.createElement("span");
    bracket.className = "ld-bracket";
    el.appendChild(bracket);
    L.digits.forEach(function (digit, c) { cell(2, c, String(digit)); });

    if (showAnswer) {
      L.rows.forEach(function (row, idx) {
        var gridRow = idx + 3;
        if (row.type === "num") {
          row.cells.forEach(function (rc) { cell(gridRow, rc.col, rc.ch); });
        } else {
          var rule = document.createElement("span");
          rule.className = "ld-rule";
          rule.style.gridRow = gridRow;
          rule.style.gridColumn = (row.from + 3) + " / " + (row.to + 4);
          el.appendChild(rule);
        }
      });
    }
    return el;
  }

  function longDivisionHeight(p, fontPx, showAnswer) {
    var rowH = fontPx * 1.2, ruleH = fontPx * 0.3;
    var h = rowH * 2;
    if (showAnswer) {
      longDivisionLayout(p.a, p.b).rows.forEach(function (row) {
        h += row.type === "num" ? rowH : ruleH;
      });
    }
    return h;
  }

  // 화면의 .ld 격자와 같은 배치로 캔버스에 그린다. 그린 영역의 아래쪽 y를 돌려준다.
  function drawLongDivision(ctx, p, centerX, top, fontPx, showAnswer, inkColor, answerColor) {
    var L = longDivisionLayout(p.a, p.b);
    var cellW = fontPx * 0.72, gapW = fontPx * 0.32, rowH = fontPx * 1.2, ruleH = fontPx * 0.3;
    ctx.font = "bold " + fontPx + "px 'Courier Prime', monospace";
    var divisorW = ctx.measureText(String(p.b)).width + fontPx * 0.18;
    var totalW = divisorW + gapW + L.n * cellW;
    var digitsLeft = centerX - totalW / 2 + divisorW + gapW;
    var bracketX = digitsLeft - gapW;

    function colX(c) { return digitsLeft + cellW * (c + 0.5); }

    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "center";
    var y = top;
    if (showAnswer) {
      ctx.fillStyle = answerColor;
      L.quotient.forEach(function (ch, c) { if (ch) ctx.fillText(ch, colX(c), y + fontPx); });
    }
    y += rowH;

    ctx.fillStyle = inkColor;
    ctx.strokeStyle = inkColor;
    ctx.textAlign = "right";
    ctx.fillText(String(p.b), bracketX - fontPx * 0.18, y + fontPx);
    ctx.textAlign = "center";
    L.digits.forEach(function (digit, c) { ctx.fillText(String(digit), colX(c), y + fontPx); });

    var lw = Math.max(2, fontPx * 0.08);
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(bracketX, y + rowH);
    ctx.lineTo(bracketX, y + fontPx * 0.6);
    ctx.quadraticCurveTo(bracketX, y, bracketX + fontPx * 0.45, y);
    ctx.lineTo(digitsLeft + L.n * cellW, y);
    ctx.stroke();
    y += rowH;

    if (showAnswer) {
      ctx.lineWidth = 2;
      L.rows.forEach(function (row) {
        if (row.type === "num") {
          row.cells.forEach(function (rc) { ctx.fillText(rc.ch, colX(rc.col), y + fontPx); });
          y += rowH;
        } else {
          ctx.beginPath();
          ctx.moveTo(digitsLeft + cellW * row.from, y + ruleH / 2);
          ctx.lineTo(digitsLeft + cellW * (row.to + 1), y + ruleH / 2);
          ctx.stroke();
          y += ruleH;
        }
      });
    }
    ctx.textAlign = "left";
    return y;
  }

  function mulParts(p) {
    return { p1: p.a * (p.b % 10), p2: p.a * Math.floor(p.b / 10) };
  }

  function mulAnswerHTML(p, prefix) {
    var parts = mulParts(p);
    return (
      "<div>" + p.a + "</div>" +
      "<div>&times; " + p.b + "</div>" +
      '<div class="' + prefix + '-rule"></div>' +
      "<div>" + parts.p1 + "</div>" +
      "<div>" + parts.p2 + "&nbsp;</div>" +
      '<div class="' + prefix + '-rule"></div>' +
      '<div class="' + prefix + '-sum">' + p.answer + "</div>"
    );
  }

  function fillAnswer(container, p, prefix) {
    container.innerHTML = "";
    if (p.kind === "mul") {
      container.innerHTML = mulAnswerHTML(p, prefix);
      return;
    }
    container.appendChild(buildLongDivision(p, true));
    var result = document.createElement("div");
    result.className = "ld-result";
    result.textContent = resultText(p);
    container.appendChild(result);
  }

  var board = document.getElementById("board");
  var cards = Array.prototype.slice.call(board.querySelectorAll(".card"));

  var weekday = ["일", "월", "화", "수", "목", "금", "토"][new Date().getDay()];
  var todayDisplay =
    new Date().getFullYear() + "년 " + (new Date().getMonth() + 1) + "월 " + new Date().getDate() + "일 (" + weekday + ")";
  document.getElementById("today-date").textContent = todayDisplay;
  document.getElementById("print-date-text").textContent = todayDisplay;

  function renderCard(index) {
    var card = cards[index];
    var p = problems[index];
    var cfg = MODES[p.kind];

    var group = card.querySelector(".diff-group");
    if (cfg.fixedLevels) {
      // 나눗셈은 카드마다 단원이 정해져 있어 고르는 버튼 대신 단원 이름만 보여준다.
      group.setAttribute("data-mode", p.kind);
      group.removeAttribute("aria-label");
      group.innerHTML = "";
      var tag = document.createElement("span");
      tag.className = "unit-tag";
      tag.textContent = levelName(p);
      group.appendChild(tag);
    } else if (group.getAttribute("data-mode") !== p.kind) {
      group.innerHTML = "";
      cfg.levels.forEach(function (level) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "diff-btn";
        btn.setAttribute("data-diff", level.key);
        if (level.name) btn.title = level.name;
        btn.textContent = level.label;
        group.appendChild(btn);
      });
      group.setAttribute("data-mode", p.kind);
      group.setAttribute("aria-label", "문제 " + (index + 1) + " " + cfg.groupLabel);
    }
    group.querySelectorAll(".diff-btn").forEach(function (btn) {
      var isActive = btn.getAttribute("data-diff") === p.diff;
      btn.setAttribute("aria-pressed", isActive ? "true" : "false");
    });

    var problemEl = card.querySelector(".problem");
    if (p.kind === "mul") {
      problemEl.innerHTML =
        '<div class="num top-num">' + p.a + "</div>" +
        '<div class="num bottom-row"><span class="op">&times;</span><span>' + p.b + "</span></div>" +
        '<div class="rule"></div>';
    } else {
      problemEl.innerHTML = "";
      problemEl.appendChild(buildLongDivision(p, false));
    }
    var workspace = document.createElement("div");
    workspace.className = "workspace";
    workspace.setAttribute("aria-hidden", "true");
    problemEl.appendChild(workspace);
    problemEl.setAttribute("aria-label", spokenText(p) + ", " + levelName(p));

    card.querySelector('[data-action="undo"]').disabled = history[index].length === 0;
  }

  function renderAll() {
    for (var i = 0; i < problems.length; i++) renderCard(i);
  }

  var tagline = document.getElementById("tagline");
  var modeTabs = Array.prototype.slice.call(document.querySelectorAll(".mode-tab"));
  var printProblemEls = document.querySelectorAll(".print-problem");
  var printAnswerEls = document.querySelectorAll(".print-answer");

  function renderMode() {
    board.setAttribute("data-mode", mode);
    cards.forEach(function (card, i) { card.hidden = i >= problems.length; });
    printProblemEls.forEach(function (el, i) { el.hidden = i >= problems.length; });
    printAnswerEls.forEach(function (el, i) { el.hidden = i >= problems.length; });
    modeTabs.forEach(function (tab) {
      tab.setAttribute("aria-pressed", tab.getAttribute("data-mode") === mode ? "true" : "false");
    });
    tagline.textContent = MODES[mode].tagline;
    document.getElementById("print-kind").textContent = MODES[mode].name;
    renderAll();
  }

  document.getElementById("mode-tabs").addEventListener("click", function (e) {
    var tab = e.target.closest(".mode-tab");
    if (!tab) return;
    var next = tab.getAttribute("data-mode");
    if (next === mode) return;
    useMode(next);
    saveMode(next);
    renderMode();
  });

  function renderPrintSheet() {
    document.getElementById("print-sheet").setAttribute("data-mode", mode);
    problems.forEach(function (p, i) {
      var problemCard = printProblemEls[i];
      problemCard.querySelector('[data-role="label"]').textContent = "문제 " + (i + 1) + " · " + levelName(p);
      var problemCalc = problemCard.querySelector('[data-role="calc"]');
      if (p.kind === "mul") {
        problemCalc.innerHTML = "<div>" + p.a + "</div><div>&times; " + p.b + '</div><div class="pp-rule"></div>';
      } else {
        problemCalc.innerHTML = "";
        problemCalc.appendChild(buildLongDivision(p, false));
      }

      var answerCard = printAnswerEls[i];
      answerCard.querySelector('[data-role="label"]').textContent = "문제 " + (i + 1) + " 풀이";
      fillAnswer(answerCard.querySelector('[data-role="calc"]'), p, "pa");
    });
  }

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 2200);
  }

  var answerModal = document.getElementById("answer-modal");
  var answerModalMeta = document.getElementById("answer-modal-meta");
  var answerModalCalc = document.getElementById("answer-modal-calc");
  var answerModalClose = document.getElementById("answer-modal-close");

  function openAnswerModal(index) {
    var p = problems[index];
    answerModalMeta.textContent = "문제 " + (index + 1) + " · " + levelName(p);
    fillAnswer(answerModalCalc, p, "modal");
    var spokenAnswer = p.kind === "div" && p.remainder ? "몫은 " + p.answer + ", 나머지는 " + p.remainder : p.answer;
    answerModalCalc.setAttribute("aria-label", spokenText(p) + "는 " + spokenAnswer + "입니다");
    answerModal.hidden = false;
    answerModalClose.focus();
  }

  function closeAnswerModal() {
    answerModal.hidden = true;
  }

  answerModalClose.addEventListener("click", closeAnswerModal);
  answerModal.addEventListener("click", function (e) {
    if (e.target === answerModal) closeAnswerModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !answerModal.hidden) closeAnswerModal();
  });

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawAllProblemsImage() {
    var scale = 2;
    var cardW = 260, gap = 18, padding = 20, top = 42, cardH = 210;
    var w = padding * 2 + cardW * problems.length + gap * (problems.length - 1);
    var h = top + cardH + padding;
    var canvas = document.createElement("canvas");
    canvas.width = w * scale;
    canvas.height = h * scale;
    var ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);

    ctx.fillStyle = "#f3f5fb";
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = "#1d2440";
    ctx.font = "bold 16px 'Gowun Dodum', sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("매일 수학 · " + dateStr + " " + MODES[mode].name + " 문제", padding, 26);

    problems.forEach(function (p, i) {
      var x = padding + i * (cardW + gap);
      var right = x + cardW - 18;

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#d7def2";
      ctx.lineWidth = 2;
      roundRect(ctx, x, top, cardW, cardH, 12);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#55608a";
      ctx.font = "13px 'Gowun Dodum', sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("문제 " + (i + 1) + " · " + levelName(p), x + 18, top + 26);

      var linesFrom;
      if (p.kind === "mul") {
        ctx.fillStyle = "#1d2440";
        ctx.font = "bold 34px 'Courier Prime', monospace";
        ctx.textAlign = "right";
        ctx.fillText(String(p.a), right, top + 66);
        ctx.fillText("× " + p.b, right, top + 106);

        ctx.strokeStyle = "#1d2440";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 18, top + 118);
        ctx.lineTo(right, top + 118);
        ctx.stroke();
        linesFrom = top + 142;
      } else {
        var bottom = drawLongDivision(ctx, p, x + cardW / 2, top + 36, 34, false, "#1d2440", "#d6483c");
        linesFrom = bottom + 24;
      }

      ctx.strokeStyle = "#d7def2";
      ctx.lineWidth = 1;
      for (var ly = linesFrom; ly < top + cardH - 14; ly += 24) {
        ctx.beginPath();
        ctx.moveTo(x + 18, ly);
        ctx.lineTo(right, ly);
        ctx.stroke();
      }
      ctx.textAlign = "left";
    });

    return canvas;
  }

  function drawAllAnswersImage() {
    var scale = 2;
    var cardW = 260, gap = 18, padding = 20, top = 42, cardH = 245;
    var ldFont = 22;
    problems.forEach(function (p) {
      if (p.kind === "div") cardH = Math.max(cardH, 40 + longDivisionHeight(p, ldFont, true) + 48);
    });
    var w = padding * 2 + cardW * problems.length + gap * (problems.length - 1);
    var h = top + cardH + padding;
    var canvas = document.createElement("canvas");
    canvas.width = w * scale;
    canvas.height = h * scale;
    var ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);

    ctx.fillStyle = "#f3f5fb";
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = "#1d2440";
    ctx.font = "bold 16px 'Gowun Dodum', sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("매일 수학 · " + dateStr + " " + MODES[mode].name + " 풀이", padding, 26);

    problems.forEach(function (p, i) {
      var x = padding + i * (cardW + gap);
      var right = x + cardW - 18;

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#d7def2";
      ctx.lineWidth = 2;
      roundRect(ctx, x, top, cardW, cardH, 12);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#55608a";
      ctx.font = "13px 'Gowun Dodum', sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("문제 " + (i + 1) + " · " + levelName(p), x + 18, top + 24);

      if (p.kind === "div") {
        var bottom = drawLongDivision(ctx, p, x + cardW / 2, top + 40, ldFont, true, "#1d2440", "#d6483c");
        ctx.fillStyle = "#d6483c";
        ctx.font = "bold 20px 'Courier Prime', monospace";
        ctx.textAlign = "center";
        ctx.fillText(resultText(p), x + cardW / 2, bottom + 30);
        ctx.textAlign = "left";
        return;
      }

      var parts = mulParts(p);

      ctx.fillStyle = "#1d2440";
      ctx.font = "bold 26px 'Courier Prime', monospace";
      ctx.textAlign = "right";
      var y = top + 58;
      ctx.fillText(String(p.a), right, y);
      y += 32;
      ctx.fillText("× " + p.b, right, y);

      y += 8;
      ctx.strokeStyle = "#1d2440";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 18, y);
      ctx.lineTo(right, y);
      ctx.stroke();

      ctx.font = "20px 'Courier Prime', monospace";
      var charWidth = ctx.measureText("0").width;
      y += 28;
      ctx.fillText(String(parts.p1), right, y);
      y += 26;
      ctx.fillText(String(parts.p2), right - charWidth, y);

      y += 8;
      ctx.beginPath();
      ctx.moveTo(x + 18, y);
      ctx.lineTo(right, y);
      ctx.stroke();

      ctx.fillStyle = "#d6483c";
      ctx.font = "bold 30px 'Courier Prime', monospace";
      y += 34;
      ctx.fillText(String(p.answer), right, y);

      ctx.textAlign = "left";
    });

    return canvas;
  }

  function saveBlob(canvas, filename) {
    return new Promise(function (resolve) {
      canvas.toBlob(async function (blob) {
        if (!blob) { showToast("이미지를 만들지 못했어요"); resolve(false); return; }

        if (window.claude && typeof window.claude.use === "function") {
          try {
            var downloads = await window.claude.use("downloads");
            if (downloads) {
              await downloads.save({ filename: filename, data: blob });
              resolve(true);
              return;
            }
          } catch (err) {
            resolve(false);
            return;
          }
        }

        try {
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
          resolve(true);
        } catch (err) {
          showToast("이 브라우저에서는 다운로드를 지원하지 않아요");
          resolve(false);
        }
      }, "image/png");
    });
  }

  board.addEventListener("click", function (e) {
    var diffBtn = e.target.closest(".diff-btn");
    var actionBtn = e.target.closest("[data-action]");
    var card = e.target.closest(".card");
    if (!card) return;
    var index = Number(card.getAttribute("data-index"));

    if (diffBtn) {
      var diff = diffBtn.getAttribute("data-diff");
      if (diff !== problems[index].diff) {
        replaceProblem(index, diff, Math.random);
        renderCard(index);
      }
      return;
    }

    if (actionBtn) {
      var action = actionBtn.getAttribute("data-action");
      if (action === "shuffle") {
        replaceProblem(index, problems[index].diff, Math.random);
        renderCard(index);
      } else if (action === "undo") {
        if (history[index].length > 0) {
          problems[index] = history[index].pop();
          renderCard(index);
        }
      } else if (action === "check") {
        openAnswerModal(index);
      }
    }
  });

  document.getElementById("refresh-all").addEventListener("click", function () {
    for (var i = 0; i < problems.length; i++) {
      replaceProblem(i, problems[i].diff, Math.random);
    }
    renderAll();
    showToast(MODES[mode].name + " 문제 " + problems.length + "개를 새로 냈어요");
  });

  function fileBase() {
    return "daily-math-" + dateStr + (mode === "div" ? "-division" : "");
  }

  document.getElementById("save-all-problems").addEventListener("click", async function () {
    var canvas = drawAllProblemsImage();
    var ok = await saveBlob(canvas, fileBase() + "-problems.png");
    if (ok) showToast("문제 이미지를 저장했어요");
  });

  document.getElementById("save-all-answers").addEventListener("click", async function () {
    var canvas = drawAllAnswersImage();
    var ok = await saveBlob(canvas, fileBase() + "-answers.png");
    if (ok) showToast("정답 이미지를 저장했어요");
  });

  document.getElementById("print-worksheet").addEventListener("click", function () {
    renderPrintSheet();
    window.print();
  });

  renderMode();
})();
</script>
</body>
</html>
